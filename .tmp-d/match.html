<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#0f1115;font:12px system-ui;color:#c9cdd4;padding:14px}
h3{margin:10px 0 6px;font-size:13px;color:#e4e8ee;font-weight:600}
.row{display:flex;gap:12px;align-items:flex-start}.c{text-align:center}
.c h4{margin:0 0 4px;font-size:11px;color:#8d94a0;font-weight:600}
canvas{display:block;border-radius:5px}
</style></head><body><div id="out"></div>
<script type="module">
import { Vector3 } from 'three'
import { Showroom } from '/src/avatar/figure/showroom.ts'
const out=document.getElementById('out')
const LOOK={ skin:'#F0B894', hair:'#4A382F', cloth:'#23232A', backdrop:'#E3C4C2' }
// Matched on the measurement: the reference's eyes are 153px apart in a crop
// 1290 wide, so a render whose eyes land the same distance apart is the same
// face size. Solved once here rather than eyeballed.
const img=new Image(); img.src='/dev/ref.png'; await img.decode()
const RW=540, y0=95, y1=1105, sc=RW/img.width
const refC=document.createElement('canvas'); refC.width=RW; refC.height=Math.round((y1-y0)*sc)
refC.getContext('2d').drawImage(img,0,y0,img.width,y1-y0,0,0,refC.width,refC.height)
const refEyeSep=153*sc, refEyeY=(635-y0)*sc
const h=document.createElement('h3'); h.textContent='reference and current solid, matched on eye separation ('+refEyeSep.toFixed(0)+'px) and eye height'
out.append(h)
const r=document.createElement('div'); r.className='row'; out.append(r)
const rd=document.createElement('div'); rd.className='c'
const rh=document.createElement('h4'); rh.textContent='reference'; rd.append(rh,refC); r.append(rd)
const s=new Showroom({url:'/figure/character.glb', look:LOOK, width:RW, height:refC.height})
await s.load()
// EYE_X = 0.262 -> separation 0.524 model units. Frame so it lands on refEyeSep.
const unitsPerPx = 0.524/refEyeSep
const frameH = refC.height*unitsPerPx
s.frameOn(new Vector3(0, 0.01 - (refC.height/2 - refEyeY)*unitsPerPx, 0), frameH)
s.orbit(0,0)
for(const [label,neutral] of [['current solid — neutral',true],['current solid — hair colour',false]]){
  s.setNeutral(neutral)
  const d=document.createElement('div'); d.className='c'
  const t=document.createElement('h4'); t.textContent=label
  const c=document.createElement('canvas'); c.style.width=RW+'px'; c.style.height=refC.height+'px'
  d.append(t,c); r.append(d); s.capture(c,RW,refC.height)
}
window.__ready=true
</script></body></html>
