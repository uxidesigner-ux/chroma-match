<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hair layers</title>
<style>
  body { margin: 0; background: #12141a; color: #d5dae2; font: 13px/1.4 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 18px 0 8px; color: #c9d0da; }
  p { color: #9aa3b2; max-width: 1100px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .c { text-align: center; }
  .c h3 { margin: 0 0 6px; font-size: 12px; color: #8d94a0; }
  canvas { display: block; border-radius: 4px; background: #1a1d24; }
</style>
</head>
<body>
<h1>헤어 층 — 기본 볼륨 / 주요 다발 / 보조 다발</h1>
<p>
  같은 카메라. 보조 다발을 숨겨도 긴 웨이브의 기본 형태가 남아야 한다.
  후면은 원본 크롭에 없어 같은 흐름의 연장으로 설계한 것이다.
</p>
<div id="out"></div>
<script type="module">
import { Vector3 } from 'three'
import { Showroom } from '/src/avatar/figure/showroom.ts'

const LOOK = { skin: '#F0B894', hair: '#4A382F', cloth: '#23232A', backdrop: '#E3C4C2' }
window.__viewsReady = false

const out = document.getElementById('out')
const s = new Showroom({ url: '/figure/character.glb', look: LOOK, width: 640, height: 800 })
await s.load()

function groupOf(name) {
  if (name.startsWith('lock_s')) return 'sec'
  if (name.startsWith('lock_p')) return 'prim'
  if (name.startsWith('scalp') || name.startsWith('back_')) return 'base'
  return 'other'
}

const hairParts = s.partNames().filter((n) => groupOf(n) !== 'other')
window.__hairParts = hairParts

function setLayer(which) {
  for (const n of hairParts) {
    const g = groupOf(n)
    if (which === 'base') s.setVisible(n, g === 'base')
    else if (which === 'prim') s.setVisible(n, g === 'base' || g === 'prim')
    else s.setVisible(n, true)
  }
}

const centres = s.eyeCentres()
const mid = centres
  ? centres.left.clone().add(centres.right).multiplyScalar(0.5)
  : new Vector3(0, 0, 0)
const target = mid.clone(); target.y -= 0.55
const frameH = 4.6

function panel(label, yaw, pitch, neutral, w = 360, h = 480) {
  s.setNeutral(neutral)
  s.camera.aspect = w / h
  s.camera.updateProjectionMatrix()
  s.orbit(yaw, pitch)
  s.frameOn(target, frameH)
  const c = document.createElement('canvas')
  c.width = w
  c.height = h
  c.style.width = w + 'px'
  c.style.height = h + 'px'
  s.capture(c, w, h)
  const d = document.createElement('div')
  d.className = 'c'
  const h3 = document.createElement('h3')
  h3.textContent = label
  d.append(h3, c)
  return d
}

function section(title) {
  const h = document.createElement('h2')
  h.textContent = title
  out.append(h)
}

section('정면 중성 — 같은 카메라, 세 층')
const r1 = document.createElement('div'); r1.className = 'row'
setLayer('base')
r1.append(panel('1. 기본 볼륨만', 0, 0.02, true, 380, 520))
setLayer('prim')
r1.append(panel('2. + 주요 다발', 0, 0.02, true, 380, 520))
setLayer('all')
r1.append(panel('3. + 보조 다발', 0, 0.02, true, 380, 520))
out.append(r1)

section('최종 (모든 층) — 중성 측면 / 후면')
setLayer('all')
const r2 = document.createElement('div'); r2.className = 'row'
r2.append(panel('정면 · 최종 재질', 0, 0.02, false, 340, 460))
r2.append(panel('3/4', 0.55, 0.04, true, 340, 460))
r2.append(panel('측면', 1.20, 0.02, true, 340, 460))
r2.append(panel('후면 (설계)', Math.PI, 0.02, true, 340, 460))
out.append(r2)

window.__viewsReady = true
</script>
</body>
</html>
